\uFEFF<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片 4x4 切割工具</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 90%;
            max-width: 800px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            margin: 40px 0;
        }

        h1 {
            margin-top: 0;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .drop-zone {
            border: 2px dashed var(--glass-border);
            border-radius: 16px;
            padding: 60px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            background: rgba(0,0,0,0.2);
        }

        .drop-zone:hover, .drop-zone.dragover {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.1);
        }

        .drop-zone input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }

        .drop-zone-content {
            pointer-events: none;
        }

        .drop-zone svg {
            width: 64px;
            height: 64px;
            fill: var(--text-muted);
            margin-bottom: 15px;
            transition: fill 0.3s ease;
        }

        .drop-zone:hover svg, .drop-zone.dragover svg {
            fill: var(--primary);
        }

        /* 控制面板區塊 */
        #controls-section {
            display: none;
            margin-top: 30px;
            animation: fadeIn 0.5s ease-out;
        }

        .controls-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            background: rgba(0,0,0,0.2);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            margin-bottom: 20px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .control-group label {
            font-size: 0.9rem;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .control-group input {
            width: 80px;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid var(--glass-border);
            background: rgba(255,255,255,0.1);
            color: white;
            text-align: center;
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.2s ease;
        }

        .control-group input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255,255,255,0.2);
        }

        /* 預覽區塊 */
        #preview-section {
            display: none;
            margin-top: 20px;
            animation: fadeIn 0.5s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-bottom: 30px;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
        }

        .grid-item {
            width: 100%;
            aspect-ratio: 1 / 1;
            background-color: rgba(0,0,0,0.3);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--glass-border);
            transition: transform 0.2s ease;
        }
        
        .grid-item:hover {
            transform: scale(1.05);
            border-color: var(--primary);
        }

        .grid-item canvas {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 12px 32px;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.5);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.5);
        }

        button:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .loader {
            display: none;
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

    </style>
</head>
<body>

    <div class="container">
        <h1>圖片 4x4 切割工具</h1>
        <p class="subtitle">將圖片拖放至下方區域，或是點擊選擇檔案</p>

        <div class="drop-zone" id="drop-zone">
            <input type="file" id="file-input" accept="image/*">
            <div class="drop-zone-content">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z"/></svg>
                <h3>拖放圖片至此</h3>
                <p>或點擊選擇檔案</p>
            </div>
        </div>

        <div id="controls-section">
            <h3 style="margin-top: 0;">微調裁切邊界 (位移)</h3>
            <div class="controls-grid">
                <div class="control-group">
                    <label>上方位移 (px)</label>
                    <input type="number" id="pad-top" value="0" min="0" step="5">
                </div>
                <div class="control-group">
                    <label>下方位移 (px)</label>
                    <input type="number" id="pad-bottom" value="0" min="0" step="5">
                </div>
                <div class="control-group">
                    <label>左方位移 (px)</label>
                    <input type="number" id="pad-left" value="0" min="0" step="5">
                </div>
                <div class="control-group">
                    <label>右方位移 (px)</label>
                    <input type="number" id="pad-right" value="0" min="0" step="5">
                </div>
            </div>
        </div>

        <div id="preview-section">
            <h3>預覽切割結果</h3>
            <div class="grid-container" id="grid-container">
                <!-- Canvases will be injected here -->
            </div>
            <button id="download-btn">
                <div class="loader" id="loader"></div>
                <span id="btn-text">打包下載 (ZIP)</span>
            </button>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const controlsSection = document.getElementById('controls-section');
        const previewSection = document.getElementById('preview-section');
        const gridContainer = document.getElementById('grid-container');
        const downloadBtn = document.getElementById('download-btn');
        const loader = document.getElementById('loader');
        const btnText = document.getElementById('btn-text');

        // 控制參數
        const padTopInput = document.getElementById('pad-top');
        const padBottomInput = document.getElementById('pad-bottom');
        const padLeftInput = document.getElementById('pad-left');
        const padRightInput = document.getElementById('pad-right');

        let splitDataUrls = [];
        let currentImg = null; // 儲存目前載入的圖片物件
        const rows = 4;
        const cols = 4;

        // 監聽位移參數變更，即時重新切割
        [padTopInput, padBottomInput, padLeftInput, padRightInput].forEach(input => {
            input.addEventListener('input', () => {
                if (currentImg) {
                    processImage();
                }
            });
        });

        // 避免預設行為
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // 拖曳視覺回饋
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });

        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) {
            dropZone.classList.add('dragover');
        }

        function unhighlight(e) {
            dropZone.classList.remove('dragover');
        }

        // 處理檔案放置與選擇
        dropZone.addEventListener('drop', handleDrop, false);
        fileInput.addEventListener('change', handleFileSelect, false);

        function handleDrop(e) {
            const dt = e.dataTransfer;
            const files = dt.files;
            handleFiles(files);
        }

        function handleFileSelect(e) {
            const files = e.target.files;
            handleFiles(files);
        }

        function handleFiles(files) {
            if (files.length === 0) return;
            const file = files[0];
            
            if (!file.type.match('image.*')) {
                alert('請上傳圖片檔案！');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    currentImg = img;
                    
                    // 圖片載入後，顯示控制區塊並執行初次切割
                    controlsSection.style.display = 'block';
                    processImage();
                    
                    // 滾動到預覽區
                    controlsSection.scrollIntoView({ behavior: 'smooth' });
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }

        // 執行切割
        function processImage() {
            if (!currentImg) return;
            
            gridContainer.innerHTML = '';
            splitDataUrls = [];
            
            // 讀取四個邊界的裁切值
            const padTop = parseInt(padTopInput.value) || 0;
            const padBottom = parseInt(padBottomInput.value) || 0;
            const padLeft = parseInt(padLeftInput.value) || 0;
            const padRight = parseInt(padRightInput.value) || 0;

            // 計算扣除位移後的「有效長寬」
            const effectiveWidth = currentImg.width - padLeft - padRight;
            const effectiveHeight = currentImg.height - padTop - padBottom;

            // 若扣到變負數則不處理
            if (effectiveWidth <= 0 || effectiveHeight <= 0) return;

            // 以有效長寬來計算每塊的大小
            const tileW = Math.floor(effectiveWidth / cols);
            const tileH = Math.floor(effectiveHeight / rows);

            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    const canvas = document.createElement('canvas');
                    canvas.width = tileW;
                    canvas.height = tileH;
                    const ctx = canvas.getContext('2d');
                    
                    // 根據 padding 與目前行列計算實際的繪製起始座標
                    const left = padLeft + (c * tileW);
                    const upper = padTop + (r * tileH);

                    // 將對應區域繪製到 canvas
                    ctx.drawImage(currentImg, left, upper, tileW, tileH, 0, 0, tileW, tileH);
                    
                    const gridItem = document.createElement('div');
                    gridItem.className = 'grid-item';
                    gridItem.appendChild(canvas);
                    gridContainer.appendChild(gridItem);

                    splitDataUrls.push({
                        name: `tile_${r+1}_${c+1}.png`,
                        data: canvas.toDataURL('image/png').split(',')[1] // 移除 base64 標頭
                    });
                }
            }

            previewSection.style.display = 'block';
        }

        // 下載 ZIP
        downloadBtn.addEventListener('click', async () => {
            if (splitDataUrls.length === 0) return;

            downloadBtn.disabled = true;
            loader.style.display = 'inline-block';
            btnText.textContent = '正在打包...';

            try {
                const zip = new JSZip();
                
                // 加入所有圖片到 ZIP
                splitDataUrls.forEach(item => {
                    zip.file(item.name, item.data, {base64: true});
                });

                const content = await zip.generateAsync({type: "blob"});
                
                // 建立下載連結並觸發
                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = 'split_images.zip';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (err) {
                console.error(err);
                alert('打包下載時發生錯誤！');
            } finally {
                downloadBtn.disabled = false;
                loader.style.display = 'none';
                btnText.textContent = '打包下載 (ZIP)';
            }
        });
    </script>
</body>
</html>
