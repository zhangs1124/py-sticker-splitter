<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圖片 4x4 切割工具</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #ec4899;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            background-image:
                radial-gradient(at 0% 0%, hsla(253, 16%, 7%, 1) 0, transparent 50%),
                radial-gradient(at 50% 0%, hsla(225, 39%, 30%, 1) 0, transparent 50%),
                radial-gradient(at 100% 0%, hsla(339, 49%, 30%, 1) 0, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .app-container {
            width: 100%;
            max-width: 1400px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            gap: 40px;
        }

        @media (max-width: 1000px) {
            .app-container {
                flex-direction: column;
            }
        }

        .left-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 350px;
        }

        .right-panel {
            flex: 1.5;
            display: flex;
            flex-direction: column;
        }

        h1 {
            margin-top: 0;
            font-size: 2.2rem;
            background: linear-gradient(135deg, #60a5fa, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 25px;
            font-size: 0.95rem;
        }

        .drop-zone {
            border: 2px dashed var(--glass-border);
            border-radius: 16px;
            padding: 40px 20px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.2);
            text-align: center;
            margin-bottom: 25px;
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: var(--primary);
            background: rgba(59, 130, 246, 0.1);
        }

        .drop-zone input[type="file"] {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            opacity: 0;
            cursor: pointer;
        }

        .drop-zone-content {
            pointer-events: none;
        }

        .drop-zone svg {
            width: 48px;
            height: 48px;
            fill: var(--text-muted);
            margin-bottom: 10px;
            transition: fill 0.3s ease;
        }

        .drop-zone:hover svg,
        .drop-zone.dragover svg {
            fill: var(--primary);
        }

        /* 控制面板區塊 */
        #controls-section {
            display: none;
            animation: fadeIn 0.5s ease-out;
        }

        .controls-card {
            background: rgba(0, 0, 0, 0.2);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--glass-border);
            margin-bottom: 20px;
        }

        .controls-card h3 {
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.1rem;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
        }

        /* 第一步：四角留白 */
        .padding-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .control-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input[type="number"] {
            width: 60px;
            padding: 6px;
            border-radius: 6px;
            border: 1px solid var(--glass-border);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            text-align: center;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.2s ease;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(255, 255, 255, 0.2);
        }

        /* 第二步：進階每列微調表單 */
        .advanced-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
            align-items: center;
        }

        .grid-header {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-align: center;
            padding-bottom: 5px;
        }

        .row-label {
            font-size: 0.9rem;
            text-align: right;
            padding-right: 10px;
        }

        .input-cell {
            display: flex;
            justify-content: center;
        }

        /* 預覽區塊 */
        #preview-container-wrapper {
            display: none;
            /* Controlled by JS */
            flex-direction: column;
            height: 100%;
            animation: fadeIn 0.5s ease-out;
        }

        .preview-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .preview-header h3 {
            margin: 0;
            font-size: 1.2rem;
        }

        .preview-header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            max-width: 650px;
            margin: 0 auto;
            flex-grow: 1;
        }

        .grid-item {
            width: 100%;
            background-color: rgba(0,0,0,0.3);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--glass-border);
            transition: all 0.2s ease;
            position: relative;
            cursor: pointer;
        }
        
        .grid-item:hover {
            transform: scale(1.02);
            border-color: var(--primary);
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        .grid-item.has-offset {
            border-color: var(--accent);
            box-shadow: 0 0 8px rgba(236, 72, 153, 0.4);
        }

        .grid-item canvas {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 單格右上角微調小標籤與按鈕 */
        .cell-badge {
            position: absolute;
            top: 4px;
            left: 4px;
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(4px);
            font-size: 0.68rem;
            color: #cbd5e1;
            padding: 1px 5px;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
        }

        .cell-adjust-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid var(--glass-border);
            color: #94a3b8;
            width: 22px;
            height: 22px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            padding: 0;
            box-shadow: none;
            transition: all 0.2s ease;
        }

        .cell-adjust-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            transform: scale(1.1);
        }

        .grid-item.has-offset .cell-adjust-btn {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .offset-tag {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(236, 72, 153, 0.85);
            color: white;
            font-size: 0.65rem;
            padding: 1px 4px;
            border-radius: 4px;
            pointer-events: none;
            font-weight: 500;
        }

        button {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 9999px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(59, 130, 246, 0.5);
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.5);
        }

        button:disabled {
            background: #475569;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .loader {
            display: none;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 16px;
            height: 16px;
            animation: spin 1s linear infinite;
            margin-right: 8px;
        }

        /* 單格微調 Modal 彈窗 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 999;
            animation: fadeIn 0.2s ease-out;
        }

        .modal-card {
            background: #1e293b;
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            padding: 24px;
            width: 90%;
            max-width: 380px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
        }

        .modal-header h4 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--text-main);
        }

        .modal-close {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-size: 1.2rem;
            cursor: pointer;
            padding: 0 4px;
            box-shadow: none;
        }

        .modal-close:hover {
            color: white;
            background: transparent;
            transform: none;
        }

        .modal-body {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .modal-input-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .modal-input-row label {
            font-size: 0.95rem;
            color: var(--text-muted);
        }

        .modal-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
            gap: 10px;
        }

        .modal-btn-reset {
            background: rgba(255, 255, 255, 0.08);
            color: #cbd5e1;
            box-shadow: none;
            padding: 8px 16px;
            font-size: 0.9rem;
        }

        .modal-btn-done {
            padding: 8px 20px;
            font-size: 0.9rem;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>

    <div class="app-container">

        <!-- 左側：上傳與控制面板 -->
        <div class="left-panel">
            <h1>圖片 4x4 切割工具</h1>
            <p class="subtitle">放入貼圖，一鍵微調與打包（支援單列與單格獨立微調）</p>

            <div class="drop-zone" id="drop-zone">
                <input type="file" id="file-input" accept="image/*">
                <div class="drop-zone-content">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                        <path
                            d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM14 13v4h-4v-4H7l5-5 5 5h-3z" />
                    </svg>
                    <h3>拖放圖片至此</h3>
                    <p style="margin: 5px 0 0 0; font-size: 0.9rem;">或點擊選擇檔案</p>
                </div>
            </div>

            <div id="controls-section">
                <!-- 第一步：整體留白 -->
                <div class="controls-card">
                    <h3>第一步：外框留白 (整體偏移)</h3>
                    <div class="padding-grid">
                        <div class="control-group">
                            <label>上 (px)</label>
                            <input type="number" id="pad-top" value="0" min="0" step="5">
                        </div>
                        <div class="control-group">
                            <label>下 (px)</label>
                            <input type="number" id="pad-bottom" value="0" min="0" step="5">
                        </div>
                        <div class="control-group">
                            <label>左 (px)</label>
                            <input type="number" id="pad-left" value="0" min="0" step="5">
                        </div>
                        <div class="control-group">
                            <label>右 (px)</label>
                            <input type="number" id="pad-right" value="0" min="0" step="5">
                        </div>
                    </div>
                </div>

                <!-- 第二步：進階列微調 -->
                <div class="controls-card">
                    <h3>第二步：單列微調 (X/Y 軸偏移)</h3>
                    <div class="advanced-grid">
                        <div></div>
                        <div class="grid-header">X 軸 (左右)</div>
                        <div class="grid-header">Y 軸 (上下)</div>

                        <div class="row-label">第 1 列</div>
                        <div class="input-cell"><input type="number" id="row-1-offset-x" value="0" step="5"></div>
                        <div class="input-cell"><input type="number" id="row-1-offset-y" value="0" step="5"></div>

                        <div class="row-label">第 2 列</div>
                        <div class="input-cell"><input type="number" id="row-2-offset-x" value="0" step="5"></div>
                        <div class="input-cell"><input type="number" id="row-2-offset-y" value="0" step="5"></div>

                        <div class="row-label">第 3 列</div>
                        <div class="input-cell"><input type="number" id="row-3-offset-x" value="0" step="5"></div>
                        <div class="input-cell"><input type="number" id="row-3-offset-y" value="0" step="5"></div>

                        <div class="row-label">第 4 列</div>
                        <div class="input-cell"><input type="number" id="row-4-offset-x" value="0" step="5"></div>
                        <div class="input-cell"><input type="number" id="row-4-offset-y" value="0" step="5"></div>
                    </div>
                </div>

                <!-- 第三步：輸出設定 -->
                <div class="controls-card">
                    <h3>第三步：輸出設定</h3>
                    <div style="display: flex; align-items: center; justify-content: space-between;">
                        <label style="color: var(--text-muted); font-size: 0.95rem;">啟始編號 (例: 01, 13)</label>
                        <input type="number" id="start-index" value="1" min="1" step="1" style="width: 80px;">
                    </div>
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 15px;">
                        <label style="color: var(--text-muted); font-size: 0.95rem;">自動去除純白背景</label>
                        <input type="checkbox" id="remove-bg" style="width: 18px; height: 18px; cursor: pointer;">
                    </div>
                    <div style="display: flex; align-items: center; justify-content: space-between; margin-top: 10px;">
                        <label style="color: var(--text-muted); font-size: 0.85rem;" title="數值越大，淺色也會被當成白色去除">去背容差值 (0-255)</label>
                        <input type="number" id="bg-tolerance" value="10" min="0" max="255" step="1" style="width: 80px;">
                    </div>
                </div>
            </div>
        </div>

        <!-- 右側：預覽與下載 -->
        <div class="right-panel">
            <div id="preview-container-wrapper">
                <div class="preview-header">
                    <div>
                        <h3>即時預覽切割結果</h3>
                        <p style="margin: 3px 0 0 0; font-size: 0.8rem; color: var(--text-muted);">💡 點擊任一格子可針對「單格」獨立微調 X/Y 軸</p>
                    </div>
                    <div class="preview-header-actions">
                        <button id="download-btn">
                            <div class="loader" id="loader"></div>
                            <span id="btn-text">打包下載 (ZIP)</span>
                        </button>
                        <button id="reset-settings" style="background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid rgba(255,255,255,0.1); box-shadow: none;">
                            重置全部
                        </button>
                    </div>
                </div>
                <div class="grid-container" id="grid-container">
                    <!-- Canvases will be injected here -->
                </div>
            </div>
        </div>

    </div>

    <!-- 單格微調 Modal 彈窗 -->
    <div class="modal-overlay" id="cell-modal">
        <div class="modal-card">
            <div class="modal-header">
                <h4 id="modal-title">微調單格</h4>
                <button class="modal-close" id="modal-close-btn">&times;</button>
            </div>
            <div class="modal-body">
                <div class="modal-input-row">
                    <label for="cell-offset-x">X 軸偏移 (左右 px)</label>
                    <input type="number" id="cell-offset-x" value="0" step="1">
                </div>
                <div class="modal-input-row">
                    <label for="cell-offset-y">Y 軸偏移 (上下 px)</label>
                    <input type="number" id="cell-offset-y" value="0" step="1">
                </div>
                <div style="font-size: 0.8rem; color: var(--text-muted); line-height: 1.4;">
                    說明：此數值會與「整體留白」及「該列偏移」疊加計算，並實際套用於切割與下載的圖檔。
                </div>
            </div>
            <div class="modal-actions">
                <button class="modal-btn-reset" id="cell-reset-btn">重置此格</button>
                <button class="modal-btn-done" id="cell-save-btn">完成</button>
            </div>
        </div>
    </div>

    <script>
        // DOM 元素
        const dropZone = document.getElementById('drop-zone');
        const fileInput = document.getElementById('file-input');
        const controlsSection = document.getElementById('controls-section');
        const previewWrapper = document.getElementById('preview-container-wrapper');
        const gridContainer = document.getElementById('grid-container');
        const downloadBtn = document.getElementById('download-btn');
        const loader = document.getElementById('loader');
        const btnText = document.getElementById('btn-text');

        // 整體邊界參數
        const padTopInput = document.getElementById('pad-top');
        const padBottomInput = document.getElementById('pad-bottom');
        const padLeftInput = document.getElementById('pad-left');
        const padRightInput = document.getElementById('pad-right');

        // 啟始編號參數
        const startIndexInput = document.getElementById('start-index');

        // 去背參數
        const removeBgInput = document.getElementById('remove-bg');
        const bgToleranceInput = document.getElementById('bg-tolerance');

        // 單格微調 Modal 元素
        const cellModal = document.getElementById('cell-modal');
        const modalTitle = document.getElementById('modal-title');
        const modalCloseBtn = document.getElementById('modal-close-btn');
        const cellOffsetXInput = document.getElementById('cell-offset-x');
        const cellOffsetYInput = document.getElementById('cell-offset-y');
        const cellResetBtn = document.getElementById('cell-reset-btn');
        const cellSaveBtn = document.getElementById('cell-save-btn');

        let activeCell = { r: 0, c: 0 };

        // 各列獨立 X/Y 位移參數
        const rowOffsetsInput = [
            { x: document.getElementById('row-1-offset-x'), y: document.getElementById('row-1-offset-y') },
            { x: document.getElementById('row-2-offset-x'), y: document.getElementById('row-2-offset-y') },
            { x: document.getElementById('row-3-offset-x'), y: document.getElementById('row-3-offset-y') },
            { x: document.getElementById('row-4-offset-x'), y: document.getElementById('row-4-offset-y') }
        ];

        // 4x4 各格獨立 X/Y 偏移量矩陣
        const rows = 4;
        const cols = 4;
        let cellOffsets = Array.from({ length: rows }, () => 
            Array.from({ length: cols }, () => ({ x: 0, y: 0 }))
        );

        let allInputs = [padTopInput, padBottomInput, padLeftInput, padRightInput, startIndexInput, removeBgInput, bgToleranceInput];
        rowOffsetsInput.forEach(r => {
            allInputs.push(r.x, r.y);
        });

        // 重置按鈕邏輯
        document.getElementById('reset-settings').addEventListener('click', () => {
            if (!confirm('確定要將所有設定（包含每列與單格微調）恢復為預設值嗎？')) return;
            
            padTopInput.value = 0;
            padBottomInput.value = 0;
            padLeftInput.value = 0;
            padRightInput.value = 0;
            startIndexInput.value = 1;
            removeBgInput.checked = false;
            bgToleranceInput.value = 10;
            
            rowOffsetsInput.forEach(r => {
                r.x.value = 0;
                r.y.value = 0;
            });

            // 重置所有單格偏移
            for (let r = 0; r < rows; r++) {
                for (let c = 0; c < cols; c++) {
                    cellOffsets[r][c] = { x: 0, y: 0 };
                }
            }
            
            if (currentImg) processImage();
        });

        let splitDataUrls = [];
        let currentImg = null;

        // 監聽所有參數變更
        allInputs.forEach(input => {
            input.addEventListener('input', () => {
                if (currentImg) {
                    processImage();
                }
            });
        });

        // Modal 相關事件
        function openCellModal(r, c, fileName) {
            activeCell = { r, c };
            modalTitle.textContent = `微調單格：${fileName} (第 ${r + 1} 列 第 ${c + 1} 欄)`;
            cellOffsetXInput.value = cellOffsets[r][c].x;
            cellOffsetYInput.value = cellOffsets[r][c].y;
            cellModal.style.display = 'flex';
            cellOffsetXInput.focus();
            cellOffsetXInput.select();
        }

        function closeCellModal() {
            cellModal.style.display = 'none';
        }

        modalCloseBtn.addEventListener('click', closeCellModal);
        cellSaveBtn.addEventListener('click', () => {
            closeCellModal();
        });

        cellModal.addEventListener('click', (e) => {
            if (e.target === cellModal) closeCellModal();
        });

        // 監聽 Modal 輸入框變更
        [cellOffsetXInput, cellOffsetYInput].forEach(input => {
            input.addEventListener('input', () => {
                const r = activeCell.r;
                const c = activeCell.c;
                cellOffsets[r][c].x = parseInt(cellOffsetXInput.value) || 0;
                cellOffsets[r][c].y = parseInt(cellOffsetYInput.value) || 0;
                if (currentImg) processImage();
            });
        });

        cellResetBtn.addEventListener('click', () => {
            const r = activeCell.r;
            const c = activeCell.c;
            cellOffsets[r][c] = { x: 0, y: 0 };
            cellOffsetXInput.value = 0;
            cellOffsetYInput.value = 0;
            if (currentImg) processImage();
        });

        // 避免預設行為
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, preventDefaults, false);
        });

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // 拖曳回饋
        ['dragenter', 'dragover'].forEach(eventName => {
            dropZone.addEventListener(eventName, highlight, false);
        });
        ['dragleave', 'drop'].forEach(eventName => {
            dropZone.addEventListener(eventName, unhighlight, false);
        });

        function highlight(e) { dropZone.classList.add('dragover'); }
        function unhighlight(e) { dropZone.classList.remove('dragover'); }

        // 檔案處理
        dropZone.addEventListener('drop', handleDrop, false);
        fileInput.addEventListener('change', handleFileSelect, false);

        function handleDrop(e) { handleFiles(e.dataTransfer.files); }
        function handleFileSelect(e) { handleFiles(e.target.files); }

        function handleFiles(files) {
            if (files.length === 0) return;
            const file = files[0];

            if (!file.type.match('image.*')) {
                alert('請上傳圖片檔案！');
                return;
            }

            const reader = new FileReader();
            reader.onload = function (event) {
                const img = new Image();
                img.onload = function () {
                    currentImg = img;
                    controlsSection.style.display = 'block';
                    previewWrapper.style.display = 'flex';
                    processImage();
                }
                img.src = event.target.result;
            }
            reader.readAsDataURL(file);
        }

        // 執行切割（核心計算套用：外框留白 + 單列位移 + 單格獨立位移）
        function processImage() {
            if (!currentImg) return;

            gridContainer.innerHTML = '';
            splitDataUrls = [];

            const padTop = parseInt(padTopInput.value) || 0;
            const padBottom = parseInt(padBottomInput.value) || 0;
            const padLeft = parseInt(padLeftInput.value) || 0;
            const padRight = parseInt(padRightInput.value) || 0;

            const effectiveWidth = currentImg.width - padLeft - padRight;
            const effectiveHeight = currentImg.height - padTop - padBottom;

            if (effectiveWidth <= 0 || effectiveHeight <= 0) return;

            const tileW = Math.floor(effectiveWidth / cols);
            const tileH = Math.floor(effectiveHeight / rows);

            const startIndex = parseInt(startIndexInput.value) || 1;
            let currentIndex = startIndex;

            for (let r = 0; r < rows; r++) {
                // 取得該列獨立的 X 和 Y 偏移量
                const rowOffsetX = parseInt(rowOffsetsInput[r].x.value) || 0;
                const rowOffsetY = parseInt(rowOffsetsInput[r].y.value) || 0;

                for (let c = 0; c < cols; c++) {
                    const canvas = document.createElement('canvas');
                    canvas.width = tileW;
                    canvas.height = tileH;
                    const ctx = canvas.getContext('2d');

                    // 取得該格專屬的 X/Y 偏移量
                    const cellOffsetX = cellOffsets[r][c].x || 0;
                    const cellOffsetY = cellOffsets[r][c].y || 0;

                    // 實際切割座標計算：全域留白 + 網格基準 + 該列偏移 + 該格獨立偏移
                    const left = padLeft + (c * tileW) + rowOffsetX + cellOffsetX;
                    const upper = padTop + (r * tileH) + rowOffsetY + cellOffsetY;

                    ctx.drawImage(currentImg, left, upper, tileW, tileH, 0, 0, tileW, tileH);

                    // 執行去背邏輯
                    if (removeBgInput.checked) {
                        removeWhiteBackground(canvas, parseInt(bgToleranceInput.value) || 0);
                    }

                    const fileName = `${String(currentIndex).padStart(2, '0')}.png`;

                    const gridItem = document.createElement('div');
                    gridItem.className = 'grid-item';
                    const hasCellOffset = (cellOffsetX !== 0 || cellOffsetY !== 0);
                    if (hasCellOffset) {
                        gridItem.classList.add('has-offset');
                    }

                    // 格子標籤與微調按鈕
                    const badge = document.createElement('div');
                    badge.className = 'cell-badge';
                    badge.textContent = fileName;
                    gridItem.appendChild(badge);

                    const adjustBtn = document.createElement('button');
                    adjustBtn.className = 'cell-adjust-btn';
                    adjustBtn.innerHTML = '⚙';
                    adjustBtn.title = '點擊微調此格';
                    gridItem.appendChild(adjustBtn);

                    if (hasCellOffset) {
                        const offsetTag = document.createElement('div');
                        offsetTag.className = 'offset-tag';
                        offsetTag.textContent = `${cellOffsetX > 0 ? '+' : ''}${cellOffsetX}, ${cellOffsetY > 0 ? '+' : ''}${cellOffsetY}`;
                        gridItem.appendChild(offsetTag);
                    }

                    // 點擊格子或按鈕開啟單格微調
                    gridItem.addEventListener('click', () => {
                        openCellModal(r, c, fileName);
                    });

                    gridItem.appendChild(canvas);
                    gridContainer.appendChild(gridItem);

                    currentIndex++;

                    // 收集要輸出的圖檔資料（套用實際切割與尺寸轉換）
                    splitDataUrls.push({
                        name: fileName,
                        data: enforceLineStickerSize(canvas)
                    });

                    // 針對第一張圖，自動產生 LINE 所需的 main.png 與 tab.png
                    if (r === 0 && c === 0) {
                        splitDataUrls.push({ name: 'main.png', data: createResizedImage(canvas, 240, 240) });
                        splitDataUrls.push({ name: 'tab.png', data: createResizedImage(canvas, 96, 74) });
                    }
                }
            }
        }

        // 強制符合 LINE 貼圖規範 (最大 370x320，且寬高為偶數)
        function enforceLineStickerSize(sourceCanvas) {
            let targetW = sourceCanvas.width;
            let targetH = sourceCanvas.height;
            
            // 1. 若超過 LINE 規定的最大尺寸，則等比例縮小
            const MAX_W = 370;
            const MAX_H = 320;
            if (targetW > MAX_W || targetH > MAX_H) {
                const scale = Math.min(MAX_W / targetW, MAX_H / targetH);
                targetW = Math.floor(targetW * scale);
                targetH = Math.floor(targetH * scale);
            }
            
            // 2. 強制轉為偶數 (LINE 官方強烈建議)
            if (targetW % 2 !== 0) targetW = Math.max(2, targetW - 1);
            if (targetH % 2 !== 0) targetH = Math.max(2, targetH - 1);
            
            // 3. 如果尺寸無須變動，直接回傳
            if (targetW === sourceCanvas.width && targetH === sourceCanvas.height) {
                return sourceCanvas.toDataURL('image/png').split(',')[1];
            }
            
            // 建立新 canvas 繪製符合規範的圖片
            const canvas = document.createElement('canvas');
            canvas.width = targetW;
            canvas.height = targetH;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(sourceCanvas, 0, 0, sourceCanvas.width, sourceCanvas.height, 0, 0, targetW, targetH);
            
            return canvas.toDataURL('image/png').split(',')[1];
        }

        // 產生維持比例並置中縮放的圖片 (LINE 貼圖需求)
        function createResizedImage(sourceCanvas, targetW, targetH) {
            const canvas = document.createElement('canvas');
            canvas.width = targetW;
            canvas.height = targetH;
            const ctx = canvas.getContext('2d');
            
            const scale = Math.min(targetW / sourceCanvas.width, targetH / sourceCanvas.height);
            const w = sourceCanvas.width * scale;
            const h = sourceCanvas.height * scale;
            const x = (targetW - w) / 2;
            const y = (targetH - h) / 2;
            
            ctx.drawImage(sourceCanvas, x, y, w, h);
            return canvas.toDataURL('image/png').split(',')[1];
        }

        // 去除純白背景邏輯
        function removeWhiteBackground(canvas, tolerance) {
            const ctx = canvas.getContext('2d');
            const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            const data = imageData.data;
            
            const threshold = 255 - tolerance;

            for (let i = 0; i < data.length; i += 4) {
                const r = data[i];
                const g = data[i + 1];
                const b = data[i + 2];
                
                // 如果 RGB 皆高於臨界值，視為白色並將透明度設為 0
                if (r >= threshold && g >= threshold && b >= threshold) {
                    data[i + 3] = 0; 
                }
            }
            
            ctx.putImageData(imageData, 0, 0);
        }

        // 下載 ZIP
        downloadBtn.addEventListener('click', async () => {
            if (splitDataUrls.length === 0) return;

            downloadBtn.disabled = true;
            loader.style.display = 'inline-block';
            btnText.textContent = '打包中...';

            try {
                const zip = new JSZip();

                splitDataUrls.forEach(item => {
                    zip.file(item.name, item.data, { base64: true });
                });

                const content = await zip.generateAsync({ type: "blob" });

                const link = document.createElement('a');
                link.href = URL.createObjectURL(content);
                link.download = 'split_images.zip';
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (err) {
                console.error(err);
                alert('打包下載時發生錯誤！');
            } finally {
                downloadBtn.disabled = false;
                loader.style.display = 'none';
                btnText.textContent = '打包下載 (ZIP)';
            }
        });
    </script>
</body>

</html>
